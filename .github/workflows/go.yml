# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t go-solve:ci .

    - name: Verify Non-Root User Execution
      run: |
        USER_ID=$(docker run --rm go-solve:ci id -u)
        if [ "$USER_ID" -ne 10001 ]; then
          echo "Expected UID 10001, got $USER_ID"
          exit 1
        fi
        echo "Non-root execution verified: UID=$USER_ID"
