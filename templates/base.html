{{ define "base" }}

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Go-solve - Golang practice</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>

        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

        <!-- Local self-hosted Ace Editor -->
        <script src="/static/ace/ace.js"></script>
        <script src="/static/ace/mode-golang.js"></script>
        <script src="/static/ace/theme-gruvbox.js"></script>
        <script>
            if (window.ace) {
                ace.config.set("basePath", "/static/ace/");
                ace.config.set("modePath", "/static/ace/");
                ace.config.set("themePath", "/static/ace/");
            }
        </script>
        <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    </head>
    <body class="dark bg-neutral-800 min-h-screen flex flex-col text-neutral-200 antialiased">

    {{ template "header" . }}

    {{ block "content" . }}
    {{ end }}

    </body>
    </html>
{{ end }}
