{{ define "login-button" }}
    <div class="relative">
        <button id="dropdownButton"
                class="text-xs px-3.5 py-1.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 text-neutral-200 hover:text-white transition cursor-pointer focus:outline-none">
            Sign in
        </button>

        <!-- Dropdown Content -->
        <div id="dropdownContent"
             class="absolute right-0 top-full mt-2 w-72 bg-neutral-800 border border-neutral-700 rounded-xl shadow-xl z-50 hidden">
            {{ template "login-form" }}
        </div>
    </div>
    <script>
        (function() {
            const dropdownButton = document.getElementById('dropdownButton');
            const dropdownContent = document.getElementById('dropdownContent');

            if (dropdownButton && dropdownContent) {
                dropdownButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    dropdownContent.classList.toggle('hidden');
                });

                document.addEventListener('click', (event) => {
                    if (!dropdownButton.contains(event.target) && !dropdownContent.contains(event.target)) {
                        dropdownContent.classList.add('hidden');
                    }
                });
            }
        })();
    </script>
{{ end }}
