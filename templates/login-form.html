{{ define "login-form" }}
    <form class="p-4 flex flex-col gap-3" hx-post="/login" hx-target="this" hx-swap="outerHTML">
        <div>
            <label for="username"
                   class="block text-xs font-medium text-neutral-300 mb-1">Username</label>
            <input type="text" id="username" name="username" required
                   class="w-full px-3 py-1.5 text-xs bg-neutral-900 border border-neutral-700 text-neutral-100 rounded-lg placeholder-neutral-500 focus:outline-none focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500"
                   placeholder="Enter username">
            {{ if . }}
                {{ if .UsernameNotFound }}
                    <p class="text-rose-400 text-xs mt-1">Username not found.</p>
                {{ else if .PasswordIncorrect }}
                    <p class="text-rose-400 text-xs mt-1">Incorrect password.</p>
                {{ end }}
            {{ end }}
        </div>
        <div>
            <label for="password" class="block text-xs font-medium text-neutral-300 mb-1">Password</label>
            <input type="password" id="password" name="password" required
                   class="w-full px-3 py-1.5 text-xs bg-neutral-900 border border-neutral-700 text-neutral-100 rounded-lg placeholder-neutral-500 focus:outline-none focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500"
                   placeholder="Enter password">
        </div>
        <div class="flex items-center gap-2 pt-1">
            <button type="submit"
                    class="flex-1 py-1.5 px-3 text-xs font-medium text-white bg-neutral-700 hover:bg-neutral-600 rounded-lg transition cursor-pointer">
                Sign in
            </button>
            <a href="/signup-form"
               class="flex-1 py-1.5 px-3 text-xs text-center font-medium text-neutral-300 bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 rounded-lg transition cursor-pointer">
                Sign up
            </a>
        </div>
    </form>
{{ end }}
